name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub username
        uses: actions/github-script@v7
        id: gh
        with:
          result-encoding: string
          script: |
            const { GITHUB_ACTOR } = process.env
            const user = await github.rest.users.getByUsername({
              username: GITHUB_ACTOR
            })
            return user.name

      - name: Get name
        run: |
          echo "${{ steps.gh.outputs }}"
          echo "${{ steps.gh.outputs.result }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2.4.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:ci
