name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
      - deps

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@v5

      - name: Cache pnpm store
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            mise.toml
            pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:ci
